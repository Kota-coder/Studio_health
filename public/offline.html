<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Seva – offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; padding: 1.5rem; box-sizing: border-box; }
  main { max-width: 22rem; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; }
  p { color: #475569; line-height: 1.5; }
  button { margin-top: 1rem; font: inherit; font-weight: 600; color: #fff; background: #2563eb; border: 0;
           border-radius: .5rem; padding: .75rem 1.5rem; min-height: 44px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Seva needs an internet connection to load patient records. Check your Wi-Fi or mobile data and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
